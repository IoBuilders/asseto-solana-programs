name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  SOLANA_VERSION: "3.1.14"
  ANCHOR_VERSION: "1.0.2"
  SURFPOOL_VERSION: "1.3.0"
  RUST_TOOLCHAIN: "1.89.0"
  NODE_VERSION: "24.16"

# ── Reusable setup steps are inlined per job; caching keeps them fast. ────────

jobs:

  # ── Build ───────────────────────────────────────────────────────────────────

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-compile-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-compile-${{ runner.os }}-

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}

      - name: Install cargo-binstall
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@main

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo binstall anchor-cli@${{ env.ANCHOR_VERSION }} --no-confirm

      - run: anchor build

      - uses: actions/upload-artifact@v5
        with:
          name: anchor-build
          path: |
            target/deploy/
            target/idl/
            target/types/
          retention-days: 1

  cargo-lint:
    name: Cargo Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - run: cargo fmt --all -- --check

  ts-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: anchor-build
          path: target/

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # ── Test ────────────────────────────────────────────────────────────────────

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [compile, ts-lint]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-unit-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-unit-${{ runner.os }}-

      - run: cargo test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [compile, ts-lint]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: anchor-build
          path: target/

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-integration-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-integration-${{ runner.os }}-

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-${{ runner.os }}-${{ env.ANCHOR_VERSION }}

      - name: Cache Surfpool
        id: cache-surfpool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/surfpool
          key: surfpool-${{ runner.os }}-${{ env.SURFPOOL_VERSION }}

      - name: Install cargo-binstall
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@main

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: cargo binstall anchor-cli@${{ env.ANCHOR_VERSION }} --no-confirm

      - name: Install Surfpool
        if: steps.cache-surfpool.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/solana-foundation/surfpool/releases/download/v${SURFPOOL_VERSION}/surfpool-linux-x64.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: solana-keygen new --no-bip39-passphrase --force -o test-wallet.json
      - run: anchor test --skip-build