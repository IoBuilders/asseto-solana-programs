[provider]
cluster = "localnet"
wallet = "./test-wallet.json"

[scripts]
# `TEST_FILE` narrows the run to one suite: `TEST_FILE=pause anchor test --skip-build`.
# Leaving it unset keeps the default glob (`**/*`) and runs every suite.
test = "NODE_OPTIONS='--import tsx' npx mocha -t 1000000 --require tests/setup.ts \"tests/${TEST_FILE:-**/*}.ts\""
