[toolchain]
package_manager = "npm"

[workspace]
members = [
    "programs/deactivate",
    "programs/freeze",
    "programs/deploy",
    "programs/metadata-update",
    "programs/mint",
    "programs/operations",
    "programs/pause",
    "programs/snapshot",
    "programs/transfer",
    "programs/transfer-control",
    "programs/transfer-hook",
    "programs/bond",
    "programs/coupon",
    "programs/treasury",
]

[features]
resolution = true
skip-lint = false

