[toolchain]
package_manager = "npm"

[workspace]
members = [
    "programs/cmtat-deactivate",
    "programs/cmtat-freeze",
    "programs/cmtat-deploy",
    "programs/cmtat-metadata-update",
    "programs/cmtat-mint",
    "programs/cmtat-operations",
    "programs/cmtat-pause",
    "programs/cmtat-snapshot",
    "programs/cmtat-transfer",
    "programs/cmtat-transfer-control",
    "programs/cmtat-transfer-hook",
    "programs/cmtat-bond",
    "programs/cmtat-coupon",
    "programs/cmtat-treasury",
]

[features]
resolution = true
skip-lint = false

[programs.localnet]
