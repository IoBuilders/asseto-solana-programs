[package]
name = "access-control"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "access_control"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "common/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
bytemuck = { version = "1.17", features = ["derive", "min_const_generics"] }
common = { path = "../common" }

[lints.rust]
unexpected_cfgs = { level = "allow" }
