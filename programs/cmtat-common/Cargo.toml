[package]
name = "cmtat-common"
version = "0.1.0"
edition = "2021"

[lib]
name = "cmtat_common"

[features]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1" }
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
