[package]
name = "cmtat-deploy"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cmtat_deploy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["interface-instructions"] }
cmtat-common = { path = "../cmtat-common" }
cmtat-freeze = { path = "../cmtat-freeze", features = ["cpi"] }
cmtat-metadata-update = { path = "../cmtat-metadata-update", features = ["cpi"] }
cmtat-mint = { path = "../cmtat-mint", features = ["cpi"] }
cmtat-operations = { path = "../cmtat-operations", features = ["cpi"] }
cmtat-pause = { path = "../cmtat-pause", features = ["cpi"] }
cmtat-transfer = { path = "../cmtat-transfer", features = ["cpi"] }
cmtat-transfer-hook = { path = "../cmtat-transfer-hook", features = ["cpi"] }
anchor-spl = "0.32.1"
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }
spl-token-metadata-interface = "=0.7.0"
spl-pod = "=0.5.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
