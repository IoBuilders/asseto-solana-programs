[package]
name = "cmtat-treasury"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cmtat_treasury"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["interface-instructions", "init-if-needed"] }
anchor-spl = "0.32.1"
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }
cmtat-common = { path = "../cmtat-common" }
cmtat-bond = { path = "../cmtat-bond", features = ["cpi"] }
cmtat-coupon = { path = "../cmtat-coupon", features = ["cpi"] }
cmtat-snapshot = { path = "../cmtat-snapshot", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
