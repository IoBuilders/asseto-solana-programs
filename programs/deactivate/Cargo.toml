[package]
name = "deactivate"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "deactivate"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2" }
anchor-spl = "1.0.2"
spl-token-2022 = { version = ">=10.0.0, <11", features = ["no-entrypoint"] }
common = { path = "../common" }

[lints.rust]
unexpected_cfgs = { level = "allow" }
