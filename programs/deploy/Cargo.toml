[package]
name = "deploy"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "deploy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2" }
common = { path = "../common" }
freeze = { path = "../freeze", features = ["cpi"] }
metadata-update = { path = "../metadata-update", features = ["cpi"] }
mint = { path = "../mint", features = ["cpi"] }
operations = { path = "../operations", features = ["cpi"] }
pause = { path = "../pause", features = ["cpi"] }
transfer = { path = "../transfer", features = ["cpi"] }
transfer-hook = { path = "../transfer-hook", features = ["cpi"] }
anchor-spl = "1.0.2"
spl-token-2022 = { version = ">=10.0.0, <11", features = ["no-entrypoint"] }
spl-token-metadata-interface = ">=0.8.0, <1"
spl-pod = ">=0.7.0"
solana-system-interface = ">=2.0.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }
