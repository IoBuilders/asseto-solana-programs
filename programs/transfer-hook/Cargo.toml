[package]
name = "transfer-hook"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
spl-token-2022 = { version = ">=10.0.0, <11", features = ["no-entrypoint"] }
spl-transfer-hook-interface = { version = ">=2.0.0, <3" }
spl-tlv-account-resolution = { version = ">=0.11.1, <0.12" }
common = { path = "../common" }
snapshot = { path = "../snapshot", features = ["cpi"] }
freeze = { path = "../freeze", features = ["cpi"] }
transfer-control = { path = "../transfer-control", features = ["cpi"] }
solana-instructions-sysvar = ">=3.0.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }
